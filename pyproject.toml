[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius"
version = "0.1.0"
description = "Semantic provenance tracing for a data element (ORIGIN + TRACE + CURRENT_STATE)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ruslan Malyavskiy" }]
keywords = ["provenance", "semantic-trace", "data-provenance", "ed25519", "title", "notarius"]

# Proprietary license (AD-82): all rights reserved, see LICENSE.
license = { text = "LicenseRef-Proprietary — All Rights Reserved (see LICENSE)" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Natural Language :: English",
]

# Required dependency — asymmetric signing.
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
# Integrations of ready-made standards (AD-31): recovery + trusted time.
integrations = ["reedsolo>=1.7", "opentimestamps>=0.4"]

[project.scripts]
# Minimal product (AD-64): notarius check/seal/verify.
notarius = "notarius.cli:main"

[project.urls]
Homepage = "https://github.com/Rus1978Rus/Notarius"
Source = "https://github.com/Rus1978Rus/Notarius"

[tool.setuptools]
packages = ["notarius", "algorithms"]
# Do not emit License-File (Metadata 2.4) for compatibility with older twine;
# the license is described in NOTICE.txt and the license field.
license-files = []

[tool.setuptools.package-data]
notarius = ["py.typed", "data/*.txt"]
